<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="robots" content="noindex, nofollow">
<title>Evacuation map | خريطة الإخلاء</title>
<!--
  Shows a room's evacuation map WITHOUT going through ChatGPT.

  Why this page exists: the ChatGPT iOS app renders external markdown images as
  an empty bubble, so the assistant can only hand a phone a link, never a
  picture. The 105 maps already ship with this gate, so the gate can simply show
  one. Nothing here depends on ChatGPT rendering anything.

  ?room=g-pharmacy.jpg (or ?room=g-pharmacy) opens that map straight away, so a
  sign outside a single room can carry its own QR.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f4f6; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 4px 0 2px; text-align: center; }
  h1.ar { direction: rtl; font-size: 16px; margin: 0 0 14px; color: #555; font-weight: 600; }
  input[type="search"] {
    width: 100%; padding: 14px 14px; font-size: 17px; border: 2px solid #ddd;
    border-radius: 11px; font-family: inherit; -webkit-appearance: none;
  }
  input[type="search"]:focus { outline: none; border-color: #c0392b; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; max-height: 62vh; overflow-y: auto; }
  li button {
    width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 8px;
    border: 1.5px solid #e5e5ea; border-radius: 11px; background: #fff;
    font-size: 15px; font-weight: 600; color: #1c1c1e; font-family: inherit;
  }
  li button:active { background: #f2f2f5; }
  .ar { display: block; direction: rtl; font-weight: 500; font-size: 14px; color: #666; margin-top: 2px; }
  .floor { float: right; font-size: 11px; color: #999; font-weight: 600; }
  .none { text-align: center; color: #999; font-size: 14px; padding: 20px; }
  /* Viewer */
  #viewer { display: none; }
  #viewer.on { display: block; }
  #picker.off { display: none; }
  #viewer img { width: 100%; height: auto; border-radius: 10px; background: #fff; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar button, .bar a {
    padding: 11px 14px; border-radius: 10px; border: 1.5px solid #e5e5ea;
    background: #fff; font-size: 14px; font-weight: 600; color: #1c1c1e;
    text-decoration: none; font-family: inherit;
  }
  .bar .title { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.25; }
  .bar .title span { display: block; direction: rtl; font-weight: 500; font-size: 13px; color: #666; }
  .go {
    display: block; margin-top: 14px; padding: 15px; border-radius: 11px;
    background: #c0392b; color: #fff; font-size: 16px; font-weight: 700;
    text-align: center; text-decoration: none;
  }
  .hint { margin-top: 12px; font-size: 12px; color: #999; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div id="picker">
    <h1>Find your room</h1>
    <h1 class="ar" lang="ar">ابحث عن غرفتك</h1>
    <input type="search" id="q" placeholder="Room name | اسم الغرفة" autocomplete="off" autofocus>
    <ul id="list"></ul>
    <p class="none" id="none" hidden>No room matches | لا توجد غرفة مطابقة</p>
  </div>

  <div id="viewer">
    <div class="bar">
      <button type="button" id="back">‹ Back</button>
      <div class="title" id="rname"></div>
    </div>
    <img id="mapimg" alt="Evacuation route | مسار الإخلاء">
    <a class="go" id="assistant" href="#">Open the assistant | افتح المساعد</a>
    <p class="hint">Pinch to zoom<br><span lang="ar" dir="rtl">قرّب بإصبعيك للتكبير</span></p>
  </div>
</div>
<script>
  var FALLBACK_GPT = "https://chatgpt.com/g/g-6a5f365ddf208191a80168ca39636c9c";
  var rooms = [];

  function validConfig(v) {
    if (!v || typeof v !== "object") return false;
    try {
      var u = new URL(v.gpt_url);
      return u.protocol === "https:" && u.hostname === "chatgpt.com" &&
        /^\/g\/g-[A-Za-z0-9_-]+(?:-[^/?#]*)?\/?$/.test(u.pathname);
    } catch (_e) { return false; }
  }

  function show(room) {
    document.getElementById("mapimg").src = "m/" + room.f;
    document.getElementById("rname").innerHTML =
      room.en + ' <span lang="ar">' + room.ar + "</span>";
    document.getElementById("picker").className = "off";
    document.getElementById("viewer").className = "on";
    window.scrollTo(0, 0);
  }

  function render(filter) {
    var list = document.getElementById("list");
    var f = (filter || "").trim().toLowerCase();
    // Empty search shows everything: a staff member who does not know the exact
    // wording still has to be able to scroll to their room.
    var hits = rooms.filter(function (r) {
      return !f || r.en.toLowerCase().indexOf(f) >= 0 || r.ar.indexOf(filter.trim()) >= 0;
    });
    list.innerHTML = "";
    hits.slice(0, 120).forEach(function (r) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="floor">' + r.floor + "</span>" + r.en +
        '<span class="ar" lang="ar">' + r.ar + "</span>";
      b.addEventListener("click", function () { show(r); });
      li.appendChild(b);
      list.appendChild(li);
    });
    document.getElementById("none").hidden = hits.length > 0;
  }

  (async function () {
    try {
      var res = await fetch("rooms.json?t=" + Date.now(), { cache: "no-store" });
      rooms = await res.json();
    } catch (_e) {
      document.getElementById("none").hidden = false;
      return;
    }

    var gpt = FALLBACK_GPT;
    try {
      var c = await (await fetch("config.json?t=" + Date.now(), { cache: "no-store" })).json();
      if (validConfig(c)) gpt = c.gpt_url;
    } catch (_e) {}
    document.getElementById("assistant").setAttribute("href", gpt);

    render("");
    document.getElementById("q").addEventListener("input", function (e) {
      render(e.target.value);
    });
    document.getElementById("back").addEventListener("click", function () {
      document.getElementById("viewer").className = "";
      document.getElementById("picker").className = "";
      document.getElementById("q").focus();
    });

    // ?room=g-pharmacy or ?room=g-pharmacy.jpg — for a per-room wall sign.
    var want = new URLSearchParams(location.search).get("room");
    if (want) {
      var key = want.replace(/\.jpg$/i, "").toLowerCase();
      var hit = rooms.filter(function (r) {
        return r.f.replace(/\.jpg$/i, "").toLowerCase() === key;
      })[0];
      if (hit) show(hit);
    }
  }());
</script>
</body>
</html>
