<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Yarmouk Clinic Emergency Assistant</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f4f4f6;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    padding: 36px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .emoji { font-size: 44px; margin-bottom: 10px; }
  h1 {
    font-size: 19px;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  h1.ar {
    direction: rtl;
    font-size: 19px;
    margin: 0 0 20px;
    line-height: 1.3;
  }
  .sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 22px;
    line-height: 1.5;
  }
  input[type="password"] {
    width: 100%;
    font-size: 30px;
    letter-spacing: 14px;
    text-align: center;
    padding: 14px 0;
    border: 2px solid #ddd;
    border-radius: 10px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  input[type="password"]:focus { outline: none; border-color: #c0392b; }
  button {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #c0392b;
    color: #fff;
    cursor: pointer;
  }
  button:active { background: #a93226; }
  .error {
    color: #c0392b;
    font-size: 13.5px;
    margin: -6px 0 16px;
    display: none;
    line-height: 1.4;
  }
  .error.show { display: block; }
  .footer {
    margin-top: 22px;
    font-size: 11px;
    color: #999;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚨</div>
    <h1>Yarmouk Clinic Emergency Assistant</h1>
    <h1 class="ar">مساعد الطوارئ - مركز اليرموك الصحي</h1>
    <div class="sub">Enter the staff access code<br>أدخل رمز الدخول الخاص بالموظفين</div>
    <div class="error" id="errorMsg">Incorrect code, try again | الرمز غير صحيح، حاول مرة أخرى</div>
    <form id="pinForm" method="GET" action="verify.html">
      <input type="text" name="u" value="yarmouk-clinic-staff" autocomplete="username" hidden>
      <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
             autocomplete="current-password" placeholder="••••" required autofocus>
      <button type="submit">Enter | دخول</button>
    </form>
    <div class="footer">Emergency Response Assistant<br>Staff use only | لاستخدام الموظفين فقط</div>
  </div>
  <script>
    if (location.search.indexOf('error=1') !== -1) {
      document.getElementById('errorMsg').classList.add('show');
    }
  </script>
</body>
</html>
