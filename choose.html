<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>What do you need? | ماذا تحتاج؟</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f4f4f6;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    padding: 28px 22px 22px;
    max-width: 400px;
    width: 100%;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
    text-align: center;
    line-height: 1.3;
  }
  h1.ar {
    direction: rtl;
    margin: 0 0 10px;
  }
  .sub {
    font-size: 13px;
    color: #666;
    text-align: center;
    margin: 0 0 18px;
    line-height: 1.45;
  }
  .chips {
    display: grid;
    gap: 10px;
  }
  button.chip {
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    border: 1.5px solid #e5e5ea;
    border-radius: 12px;
    background: #fff;
    color: #1c1c1e;
    cursor: pointer;
    line-height: 1.35;
  }
  button.chip.primary {
    background: #c0392b;
    border-color: #c0392b;
    color: #fff;
  }
  button.chip:active { opacity: 0.88; }
  .chip .ar {
    display: block;
    direction: rtl;
    font-weight: 500;
    font-size: 14px;
    opacity: 0.92;
    margin-top: 2px;
  }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: #888;
    text-align: center;
    line-height: 1.4;
  }
  .skip {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    background: transparent;
    color: #666;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>What do you need?</h1>
    <h1 class="ar" lang="ar">ماذا تحتاج؟</h1>
    <p class="sub">Tap one — then paste it in the chat<br lang="ar" dir="rtl">اضغط خيارًا — ثم الصقه في المحادثة</p>
    <div class="chips" id="chips"></div>
    <button type="button" class="skip" id="skip">Open assistant without a suggestion<br><span lang="ar" dir="rtl">فتح المساعد بدون اقتراح</span></button>
    <p class="hint" id="status" hidden></p>
  </div>
  <script>
    var FALLBACK_CONFIG = Object.freeze({
      pin: "2026",
      gpt_url: "https://chatgpt.com/g/g-6a5f365ddf208191a80168ca39636c9c"
    });
    // These exist because the ChatGPT app does not reliably render a GPT's own
    // conversation starters — an OpenAI-side bug reported since Dec 2023 and
    // still recurring, with no setting that fixes it. Staff opening the QR were
    // landing on a blank chat with no idea what to type. This page is ours, so
    // these always render.
    var SUGGESTIONS = [
      { en: "🚨 Emergency | طوارئ", paste: "Emergency", primary: true },
      { en: "ابدأ | Start", paste: "Start", primary: false },
      { en: "Report an incident | الإبلاغ عن حادث", paste: "Report an incident", primary: false },
      { en: "☢️ Radiological | إشعاعي أو نووي", paste: "Radiological or nuclear incident", primary: false },
      { en: "Find nearest exit | أقرب مخرج", paste: "Find nearest exit", primary: false }
    ];

    function validConfig(value) {
      if (!value || typeof value !== "object") return false;
      if (!/^\d{4}$/.test(value.pin || "")) return false;
      try {
        var url = new URL(value.gpt_url);
        return url.protocol === "https:" &&
          url.hostname === "chatgpt.com" &&
          /^\/g\/g-[A-Za-z0-9_-]+(?:-[^/?#]*)?\/?$/.test(url.pathname) &&
          !url.search && !url.hash;
      } catch (_error) {
        return false;
      }
    }

    async function loadConfig() {
      try {
        var response = await fetch("config.json?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("unavailable");
        var candidate = await response.json();
        return validConfig(candidate) ? candidate : FALLBACK_CONFIG;
      } catch (_error) {
        return FALLBACK_CONFIG;
      }
    }

    function openGpt(gptUrl, pasteText) {
      var status = document.getElementById("status");
      var go = function () {
        // ChatGPT deep links do not reliably accept a prefilled message on mobile.
        // Clipboard + open is the workable QR path; staff paste once in chat.
        // ?prompt= prefills the composer on mobile web (measured); the app
        // ignores it, which is why the clipboard copy above is the real
        // mechanism. Harmless either way.
        try {
          var u = new URL(gptUrl);
          if (pasteText) u.searchParams.set("prompt", pasteText);
          location.replace(u.toString());
        } catch (_e) {
          location.replace(gptUrl);
        }
      };
      if (!pasteText) {
        go();
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(pasteText).then(function () {
          status.hidden = false;
          status.textContent = "Copied — paste in chat: " + pasteText +
            " | تم النسخ — الصق في المحادثة";
          setTimeout(go, 280);
        }).catch(go);
      } else {
        go();
      }
    }

    (async function () {
      var config = await loadConfig();
      var chips = document.getElementById("chips");
      SUGGESTIONS.forEach(function (item) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (item.primary ? " primary" : "");
        btn.innerHTML = item.en;
        btn.addEventListener("click", function () {
          openGpt(config.gpt_url, item.paste);
        });
        chips.appendChild(btn);
      });
      document.getElementById("skip").addEventListener("click", function () {
        openGpt(config.gpt_url, null);
      });
    }());
  </script>
</body>
</html>
