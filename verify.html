<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- This page decides which GPT staff land on, so a stale copy sends them to the
     wrong assistant. index.html also appends a cache-busting t= param. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Verifying…</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px; background: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding: 32px 24px; max-width: 360px; width: 100%; text-align: center;
  }
  .emoji { font-size: 44px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0 0 6px; line-height: 1.3; }
  h1.ar { direction: rtl; margin: 0 0 18px; }
  /* A REAL anchor. Not a button, not a JS navigation — see the note in the
     script below; that distinction is the whole reason this page exists. */
  a.go {
    display: block; padding: 17px 16px; border-radius: 12px; background: #c0392b;
    color: #fff; font-size: 17px; font-weight: 700; text-decoration: none;
  }
  a.go:active { background: #a93226; }
  .ar-sub { display: block; font-size: 14px; font-weight: 500; opacity: .95; margin-top: 3px; direction: rtl; }
  .hint { margin-top: 16px; font-size: 12px; color: #888; line-height: 1.5; }
  .or { margin: 18px 0 10px; font-size: 12px; color: #999; }
  .or span { display: block; direction: rtl; }
  .chips { display: grid; gap: 8px; }
  /* Chips are anchors, not buttons, for the same reason the Open control is:
     iOS only hands a link to the app on a real tap of an <a>. */
  a.chip {
    display: block; padding: 12px 14px; border: 1.5px solid #e5e5ea; border-radius: 11px;
    background: #fff; color: #1c1c1e; font-size: 15px; font-weight: 600;
    text-decoration: none; text-align: left; line-height: 1.3;
  }
  a.chip:active { background: #f2f2f5; }
  a.map {
    display: block; margin-top: 14px; padding: 13px 14px; border-radius: 11px;
    border: 1.5px solid #e5e5ea; background: #fff; color: #1c1c1e;
    font-size: 15px; font-weight: 600; text-decoration: none;
  }
  a.map:active { background: #f2f2f5; }
  #launch[hidden] { display: none; }
</style>
</head>
<body>
<div class="card" id="launch" hidden>
  <div class="emoji">🚨</div>
  <h1>Open the Emergency Assistant</h1>
  <h1 class="ar" lang="ar">افتح مساعد الطوارئ</h1>
  <a class="go" id="gpt" href="#">Open<span class="ar-sub" lang="ar">فتح</span></a>
  <p class="or">or start with a question<span lang="ar" dir="rtl">أو ابدأ بسؤال</span></p>
  <div class="chips" id="chips"></div>
  <p class="hint" id="status">Opens in the ChatGPT app<br><span lang="ar" dir="rtl">يفتح في تطبيق ChatGPT</span></p>
  <!-- Second, independent route to a floor plan. The assistant can only hand a
       phone a LINK to a map (the iOS app will not render an inline image), so
       this page serves the same 105 maps directly, with no ChatGPT involved. -->
  <a class="map" href="map.html">🗺️ Show a floor map<span class="ar-sub" lang="ar">اعرض خريطة الطابق</span></a>
</div>
<script>
  // Emergency fallback: config.json is deliberately optional at runtime.
  // If it is missing, malformed, unavailable, or unsafe, staff still reach the last
  // known-good assistant with the last known-good PIN.
  var FALLBACK_CONFIG = Object.freeze({
    pin: "2026",
    gpt_url: "https://chatgpt.com/g/g-6a5f365ddf208191a80168ca39636c9c"
  });
  var REMEMBER_KEY = "yarmouk_staff_access_v1";
  var REMEMBER_MS = 30 * 24 * 60 * 60 * 1000;

  function validConfig(value) {
    if (!value || typeof value !== "object") return false;
    if (!/^\d{4}$/.test(value.pin || "")) return false;
    try {
      var url = new URL(value.gpt_url);
      return url.protocol === "https:" &&
        url.hostname === "chatgpt.com" &&
        /^\/g\/g-[A-Za-z0-9_-]+(?:-[^/?#]*)?\/?$/.test(url.pathname) &&
        !url.search && !url.hash;
    } catch (_error) {
      return false;
    }
  }

  async function loadConfig(cacheKey) {
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 3500);
    try {
      var response = await fetch(
        "config.json?t=" + encodeURIComponent(cacheKey || Date.now()),
        { cache: "no-store", signal: controller.signal }
      );
      if (!response.ok) throw new Error("config unavailable");
      var candidate = await response.json();
      return validConfig(candidate) ? candidate : FALLBACK_CONFIG;
    } catch (_error) {
      return FALLBACK_CONFIG;
    } finally {
      clearTimeout(timeout);
    }
  }

  // This fingerprint invalidates remembered access when either the PIN or GPT
  // destination changes. It is not a security hash; both values are public on
  // this soft gate, and the PIN itself is never stored in localStorage.
  function configKey(config) {
    var input = config.pin + "\n" + config.gpt_url;
    var hash = 2166136261;
    for (var i = 0; i < input.length; i++) {
      hash ^= input.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0).toString(16);
  }

  function forgetRememberedAccess() {
    try { localStorage.removeItem(REMEMBER_KEY); } catch (_error) {}
  }

  function rememberAccess(config) {
    try {
      localStorage.setItem(REMEMBER_KEY, JSON.stringify({
        key: configKey(config),
        expires: Date.now() + REMEMBER_MS
      }));
    } catch (_error) {
      // Private-browsing/storage restrictions simply mean the PIN is requested
      // again next time; they must never block this successful entry.
    }
  }

  function rememberedAccessMatches(config) {
    try {
      var saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || "null");
      return saved && saved.key === configKey(config) &&
        Number.isFinite(saved.expires) && saved.expires > Date.now();
    } catch (_error) {
      return false;
    }
  }

  (async function () {
    var params = new URLSearchParams(location.search);
    var config = await loadConfig(params.get("t"));

    // Show a real <a> for the staff member to tap. Do NOT redirect here.
    //
    // This is the whole bug: iOS Universal Links are only honoured for a
    // user-initiated tap on an anchor. Apple deliberately ignores JavaScript
    // navigations (location.replace / location.href), because otherwise any
    // page could throw you into an app. So the old redirect never handed off to
    // the ChatGPT APP at all — it opened chatgpt.com as a web page in Safari,
    // where the GPT intro is degraded and the conversation starters collapse.
    // Opening the identical URL by tapping it works, which is exactly what
    // staff reported: fine when opened directly, blank via the QR + PIN.
    //
    // One tap, and the app opens on the GPT intro screen with its own starters.
    // The ChatGPT app does not reliably render a GPT's own conversation
    // starters, so these are ours. Each is an <a> to the assistant that copies
    // its phrase on the way out, so the staff member can paste it rather than
    // type it while walking.
    var SUGGESTIONS = [
      "Emergency",
      "طوارئ",
      "Fire",
      "Nearest exit"
    ];

    function showLaunch(gptUrl) {
      document.getElementById("gpt").setAttribute("href", gptUrl);

      var chips = document.getElementById("chips");
      SUGGESTIONS.forEach(function (phrase) {
        var a = document.createElement("a");
        a.className = "chip";
        a.textContent = phrase;
        a.setAttribute("href", gptUrl);
        a.addEventListener("click", function () {
          // Fire and forget: never block or delay the navigation on the
          // clipboard, which is denied outright in some browsers.
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(phrase);
            }
          } catch (_error) {}
          document.getElementById("status").textContent =
            "Paste it in the chat | الصقه في المحادثة";
        });
        chips.appendChild(a);
      });

      document.getElementById("launch").hidden = false;
    }

    if (params.get("remembered") === "1") {
      if (rememberedAccessMatches(config)) {
        showLaunch(config.gpt_url);
      } else {
        forgetRememberedAccess();
        location.replace("index.html?reauth=1");
      }
      return;
    }

    if (params.get("pin") === config.pin) {
      if (params.get("remember") === "1") rememberAccess(config);
      showLaunch(config.gpt_url);
    } else {
      location.replace("index.html?error=1");
    }
  }());
</script>
</body>
</html>
