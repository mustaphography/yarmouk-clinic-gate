<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- This page decides which GPT staff land on, so a stale copy sends them to the
     wrong assistant. index.html also appends a cache-busting t= param. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Verifying…</title>
</head>
<body>
<script>
  // Change CORRECT_PIN to whatever 4-digit access code the clinic wants staff to use.
  var CORRECT_PIN = "2026";

  // Points at the verified build. Bare-ID form on purpose: ChatGPT appends the
  // name slug itself, so a future rename cannot break this link.
  //
  // 2026-07-27: repointed. It previously sent staff to
  // g-6a5f365ddf208191a80168ca39636c9c, which is owned by another account and
  // cannot be edited from here — so none of the fixes ever reached staff. Asked
  // for a First-floor Preventive Health Offices fire, that GPT still named the
  // long-way-round South-center EXIT, sent no map, and asked for the user's
  // name. To hand the clinic back to that GPT once its owner applies
  // SETUP-UPDATE.md, put its id back below.
  var GPT_URL = "https://chatgpt.com/g/g-6a638134dbb081918e22ca6b0e208188";

  var params = new URLSearchParams(location.search);
  var entered = params.get('pin');

  if (entered === CORRECT_PIN) {
    location.replace(GPT_URL);
  } else {
    location.replace('index.html?error=1');
  }
</script>
</body>
</html>
